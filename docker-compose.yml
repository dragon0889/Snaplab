services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BETA_ACCESS_CODE: ${BETA_ACCESS_CODE:?Hãy đặt BETA_ACCESS_CODE trong file .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TUTOR_MODEL: ${TUTOR_MODEL:-}
      TUTOR_DAILY_AI_CAP: ${TUTOR_DAILY_AI_CAP:-500}
      # Caddy overwrites X-Real-IP with the real client address, so the rate limiter may trust it.
      TRUST_PROXY: "1"
    # Not published to the host: only Caddy can reach the app.
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Hãy đặt DOMAIN trong file .env (ví dụ snaplab.example.com)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
